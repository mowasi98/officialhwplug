<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">
    <title>Admin Wheel Preview - Homework Plug</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .wheel-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 900px;
            width: 100%;
            text-align: center;
        }
        
        h1 {
            color: #6C63FF;
            font-size: 2rem;
            margin-bottom: 10px;
        }
        
        .status-text {
            color: #666;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }
        
        #wheelCanvas {
            max-width: 100%;
            height: auto;
            border-radius: 50%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .close-btn {
            margin-top: 20px;
            padding: 12px 30px;
            background: #6C63FF;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .close-btn:hover {
            background: #5a52d5;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(108, 99, 255, 0.4);
        }
        
        .winner-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 10000;
            justify-content: center;
            align-items: center;
        }
        
        .winner-content {
            text-align: center;
            color: white;
            padding: 40px;
        }
        
        .winner-content h2 {
            font-size: 3rem;
            margin-bottom: 20px;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        /* Mobile Responsive Styles */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            
            .wheel-container {
                padding: 20px;
                border-radius: 15px;
            }
            
            h1 {
                font-size: 1.5rem;
            }
            
            .status-text {
                font-size: 0.9rem;
                margin-bottom: 20px;
            }
            
            #wheelCanvas {
                max-width: 100%;
                height: auto;
                touch-action: none;
                -webkit-user-select: none;
                user-select: none;
            }
            
            .close-btn {
                padding: 10px 20px;
                font-size: 0.9rem;
                width: 100%;
                max-width: 300px;
            }
            
            .winner-content h2 {
                font-size: 2rem;
            }
            
            .winner-content {
                padding: 20px;
            }
        }
        
        @media (max-width: 480px) {
            h1 {
                font-size: 1.2rem;
            }
            
            .status-text {
                font-size: 0.8rem;
            }
            
            .winner-content h2 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="wheel-container">
        <h1>🎡 Admin Wheel Preview</h1>
        <p class="status-text" id="statusText">Loading wheel...</p>
        <div style="position: relative; width: 100%; max-width: 700px; margin: 0 auto; transform: translateZ(0); -webkit-transform: translateZ(0);">
            <canvas id="wheelCanvas" width="700" height="700" style="width: 100%; height: auto; display: block; position: relative; z-index: 1; transform: translateZ(0); -webkit-transform: translateZ(0); backface-visibility: hidden; -webkit-backface-visibility: hidden;"></canvas>
            <!-- Pointer (white triangle at top) -->
            <div style="position: absolute; top: -5px; left: 50%; transform: translateX(-50%) translateZ(0); -webkit-transform: translateX(-50%) translateZ(0); width: 0; height: 0; border-left: 25px solid transparent; border-right: 25px solid transparent; border-top: 50px solid #fff; z-index: 999; pointer-events: none; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4)); will-change: transform;"></div>
        </div>
        <button class="close-btn" onclick="window.close()">❌ Close Window</button>
    </div>
    
    <div class="winner-overlay" id="winnerOverlay">
        <div class="winner-content">
            <h2 id="winnerText"></h2>
        </div>
    </div>
    
    <script>
        const BACKEND_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
            ? 'http://localhost:10000'
            : 'https://test2-adsw.onrender.com';
        
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        let participants = [];
        let isSpinning = false;
        let currentRotation = 0;
        let spinSpeed = 0;
        let targetRotation = 0;
        let idleSpinning = true; // constant slow spin when not actively spinning
        let lastIdleTime = performance.now();
        const IDLE_SPEED = 0.0015; // radians per ms
        
        // WebSocket connection
        let ws;
        
        function connectWebSocket() {
            const wsUrl = BACKEND_URL.replace('http', 'ws').replace('https', 'wss') + '/wheel-socket';
            ws = new WebSocket(wsUrl);
            
            ws.onopen = () => {
                console.log('✅ Admin wheel connected to live updates');
                ws.send(JSON.stringify({ type: 'subscribe', channel: 'wheel' }));
                fetchWheelData();
            };
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                
                if (data.type === 'spin') {
                    // Pass full data for synchronized spinning
                    spinWheel(data);
                } else if (data.type === 'update') {
                    participants = data.participants;
                    drawWheel();
                } else if (data.type === 'winner') {
                    showWinner(data.winner);
                }
            };
            
            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
            };
            
            ws.onclose = () => {
                console.log('WebSocket closed, reconnecting...');
                setTimeout(connectWebSocket, 3000);
            };
        }
        
        async function fetchWheelData() {
            try {
                const response = await fetch(`${BACKEND_URL}/api/giveaway/participants`);
                const data = await response.json();
                participants = data.participants;
                drawWheel();
                
                if (participants.length === 0) {
                    document.getElementById('statusText').textContent = 'No entries yet';
                } else if (participants.length === 1) {
                    document.getElementById('statusText').textContent = `${participants.length} person entered`;
                } else {
                    document.getElementById('statusText').textContent = `${participants.length} people entered`;
                }
            } catch (error) {
                console.error('Error fetching wheel data:', error);
                document.getElementById('statusText').textContent = 'Error loading wheel';
            }
        }
        
        function drawWheel() {
            if (!canvas) return;
            
            // Set canvas size for high DPI displays (Retina, etc.) - RESPONSIVE!
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
            
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            const radius = Math.min(rect.width, rect.height) / 2 - 20;
            
            // Clear canvas (transparent background, no black)
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (participants.length === 0) {
                // Draw empty wheel
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
                ctx.fillStyle = '#e0e0e0';
                ctx.fill();
                ctx.strokeStyle = '#999';
                ctx.lineWidth = 4;
                ctx.stroke();
                
                ctx.fillStyle = '#666';
                ctx.font = 'bold 24px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('Waiting for entries...', centerX, centerY);
                return;
            }
            
            // Draw wheel segments (simple, clean style from example)
            const count = participants.length;
            const sliceAngle = (2 * Math.PI) / count;
            const colors = ['#f94144', '#f3722c', '#f8961e', '#f9844a', '#f9c74f', '#90be6d', '#43aa8b', '#577590'];
            
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(currentRotation);
            
            for (let i = 0; i < count; i++) {
                const startAngle = i * sliceAngle;
                const endAngle = startAngle + sliceAngle;
                
                // Draw slice
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, radius, startAngle, endAngle);
                ctx.closePath();
                ctx.fillStyle = colors[i % colors.length];
                ctx.fill();
                ctx.strokeStyle = '#111';
                ctx.lineWidth = 2;
                ctx.stroke();
                
                // Draw text with smart formatting
                ctx.save();
                ctx.rotate(startAngle + sliceAngle / 2);
                ctx.translate(radius * 0.65, 0);
                ctx.rotate(Math.PI / 2);
                ctx.fillStyle = '#fff';
                
                // Calculate dynamic font size based on number of participants
                // More people = smaller font, but minimum 9px
                let fontSize = Math.max(9, Math.min(16, 350 / count));
                fontSize = Math.floor(fontSize);
                
                // Calculate maximum text width based on slice angle
                const sliceAngleRad = sliceAngle;
                const maxWidth = radius * sliceAngleRad * 0.75; // 75% of slice arc length
                
                // Calculate maximum vertical space available for two lines
                // Use a portion of the radius for vertical spacing (closer to center = less space)
                const textRadius = radius * 0.6; // Position text at 60% of radius
                const maxVerticalSpace = textRadius * 0.4; // Allow 40% of text radius for vertical space
                const lineSpacing = fontSize * 1.2; // Space between first and last name lines
                
                // Prepare first and last name
                let firstName = participants[i].firstName || '';
                let lastName = participants[i].lastName || '';
                
                // Helper function to shrink font and check if both lines fit
                function checkIfFits(first, last, fontSize) {
                  ctx.font = `bold ${fontSize}px Arial`;
                  const firstMetrics = ctx.measureText(first);
                  const lastMetrics = ctx.measureText(last);
                  
                  // Check if both lines fit horizontally
                  const fitsWidth = firstMetrics.width <= maxWidth && lastMetrics.width <= maxWidth;
                  
                  // Check if both lines fit vertically (font size + spacing + font size)
                  const totalHeight = fontSize + lineSpacing + fontSize;
                  const fitsHeight = totalHeight <= maxVerticalSpace;
                  
                  return fitsWidth && fitsHeight;
                }
                
                // Shrink font until both lines fit
                const minFontSize = 7;
                while (!checkIfFits(firstName, lastName, fontSize) && fontSize > minFontSize) {
                  fontSize -= 0.5;
                }
                
                // If still doesn't fit, truncate names
                if (!checkIfFits(firstName, lastName, fontSize)) {
                  ctx.font = `bold ${fontSize}px Arial`;
                  
                  // Truncate first name if too wide
                  let firstMetrics = ctx.measureText(firstName);
                  if (firstMetrics.width > maxWidth) {
                    let truncated = firstName;
                    while (ctx.measureText(truncated + '...').width > maxWidth && truncated.length > 1) {
                      truncated = truncated.substring(0, truncated.length - 1);
                    }
                    firstName = truncated + '...';
                  }
                  
                  // Truncate last name if too wide
                  let lastMetrics = ctx.measureText(lastName);
                  if (lastMetrics.width > maxWidth) {
                    let truncated = lastName;
                    while (ctx.measureText(truncated + '...').width > maxWidth && truncated.length > 1) {
                      truncated = truncated.substring(0, truncated.length - 1);
                    }
                    lastName = truncated + '...';
                  }
                }
                
                // Set final font
                ctx.font = `bold ${fontSize}px Arial`;
                ctx.textAlign = 'center';
                
                // Add text shadow for better readability
                ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
                ctx.shadowBlur = 3;
                ctx.shadowOffsetX = 1;
                ctx.shadowOffsetY = 1;
                
                // Draw first name on top line (negative Y = up)
                ctx.textBaseline = 'bottom';
                ctx.fillText(firstName, 0, -lineSpacing / 2);
                
                // Draw last name on bottom line (positive Y = down)
                ctx.textBaseline = 'top';
                ctx.fillText(lastName, 0, lineSpacing / 2);
                ctx.restore();
            }
            
            ctx.restore();
        }
        
        function spinWheel(spinData) {
            if (isSpinning) return;
            isSpinning = true;
            
            const eliminatedName = spinData.eliminatedName || spinData;
            // Use the exact targetRotation from server (in degrees) for perfect synchronization
            const targetRotationDegrees = spinData.targetRotation || (360 * 5 + Math.random() * 360);
            
            playSpinSound();
            
            const spinDuration = 8000; // 8 seconds - synchronized with main wheel
            const startTime = Date.now();
            const startRotation = currentRotation; // currentRotation is in degrees
            
            // Calculate rotation: targetRotationDegrees is absolute total rotation (including full spins)
            // We need to rotate FROM current position TO target position
            // Normalize both to 0-360 range for calculation, then add back full rotations
            const currentNormalized = currentRotation % 360;
            const targetNormalized = targetRotationDegrees % 360;
            
            // Calculate shortest path to target
            let rotationDifference = targetNormalized - currentNormalized;
            if (rotationDifference < 0) rotationDifference += 360;
            
            // Add the full rotations from targetRotationDegrees
            const fullRotations = Math.floor(targetRotationDegrees / 360);
            const totalRotation = (fullRotations * 360) + rotationDifference;
            
            function animateSpin() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / spinDuration, 1);
                
                // Ease-out cubic (same as main wheel)
                const easeOut = 1 - Math.pow(1 - progress, 3);
                currentRotation = startRotation + totalRotation * easeOut;
                
                drawWheel();
                
                if (progress < 1) {
                    requestAnimationFrame(animateSpin);
                } else {
                    // Ensure we land exactly on target rotation (synchronized with server)
                    currentRotation = targetRotationDegrees;
                    isSpinning = false;
                    drawWheel();
                    playStopSound();
                    
                    // Remove eliminated participant (sync with server state)
                    participants = participants.filter(p => `${p.firstName} ${p.lastName}` !== eliminatedName);
                    
                    // Check if we have a winner
                    if (spinData.isWinner && spinData.winner) {
                        setTimeout(() => {
                            showWinner(spinData.winner);
                        }, 2000);
                    }
                    
                    drawWheel();
                }
            }
            
            animateSpin();
        }
        
        function showWinner(winner) {
            const overlay = document.getElementById('winnerOverlay');
            const winnerText = document.getElementById('winnerText');
            
            winnerText.textContent = `🎉 ${winner.firstName} ${winner.lastName} WINS! 🎉`;
            overlay.style.display = 'flex';
            
            playWinSound();
            createConfetti();
            
            setTimeout(() => {
                overlay.style.display = 'none';
            }, 5000);
        }
        
        function playSpinSound() {
            // Placeholder for spin sound
            console.log('Playing spin sound');
        }
        
        function playStopSound() {
            // Placeholder for stop sound
            console.log('Playing stop sound');
        }
        
        function playWinSound() {
            // Placeholder for win sound
            console.log('Playing win sound');
        }
        
        function createConfetti() {
            // Placeholder for confetti animation
            console.log('Creating confetti');
        }
        
        // Initialize
        connectWebSocket();
        
        // Idle spin loop - constant slow rotation
        function idleSpinLoop(now) {
            const delta = now - lastIdleTime;
            lastIdleTime = now;
            
            // Only apply idle spin when not actively spinning
            if (idleSpinning && !isSpinning) {
                currentRotation += IDLE_SPEED * delta;
                drawWheel();
            }
            
            requestAnimationFrame(idleSpinLoop);
        }
        
        // Start idle spin loop
        requestAnimationFrame(idleSpinLoop);
        
        // Redraw on resize (with debounce for performance)
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                drawWheel();
            }, 250);
        });
        
        // Handle orientation change on mobile devices
        window.addEventListener('orientationchange', () => {
            setTimeout(() => {
                drawWheel();
            }, 300);
        });
    </script>
</body>
</html>
