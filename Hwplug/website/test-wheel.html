<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wheel Test - Local Testing Only</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        
        .wheel-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin: 0 auto 30px;
            aspect-ratio: 1;
        }
        
        #wheelCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        .pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 40px solid #fff;
            z-index: 10;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }
        
        .controls {
            text-align: center;
        }
        
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #45a049;
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .info {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }
        
        .participant-count {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎡 Wheel Test (Local Only)</h1>
        
        <div class="participant-count" id="participantCount">0 people</div>
        
        <div class="wheel-container">
            <div class="pointer"></div>
            <canvas id="wheelCanvas"></canvas>
        </div>
        
        <div class="controls">
            <button id="spinBtn" onclick="testSpin()">Spin Wheel</button>
            <button onclick="resetWheel()">Reset</button>
        </div>
        
        <div class="info">
            <p>This is a local test file. Edit the participant names in the code below.</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        
        // ============================================
        // EDIT THIS ARRAY WITH YOUR PARTICIPANT NAMES
        // ============================================
        let participants = [
            { firstName: 'Emma', lastName: 'Thompson' },
            { firstName: 'Michael', lastName: 'Rodriguez' },
            { firstName: 'Sophia', lastName: 'Anderson' },
            { firstName: 'James', lastName: 'Martinez' },
            { firstName: 'Olivia', lastName: 'Wilson' },
            { firstName: 'William', lastName: 'Brown' },
            { firstName: 'Isabella', lastName: 'Garcia' },
            { firstName: 'Benjamin', lastName: 'Davis' },
            { firstName: 'Ava', lastName: 'Miller' },
            { firstName: 'Lucas', lastName: 'Jackson' },
            { firstName: 'Mia', lastName: 'White' },
            { firstName: 'Henry', lastName: 'Harris' },
            { firstName: 'Charlotte', lastName: 'Martin' },
            { firstName: 'Alexander', lastName: 'Lee' },
            { firstName: 'Amelia', lastName: 'Clark' },
            { firstName: 'Daniel', lastName: 'Lewis' },
            { firstName: 'Harper', lastName: 'Walker' },
            { firstName: 'Matthew', lastName: 'Hall' },
            { firstName: 'Evelyn', lastName: 'Young' },
            { firstName: 'Joseph', lastName: 'King' },
        ];
        // ============================================
        
        let wheelRotation = 0;
        let isSpinning = false;
        let currentRotation = 0;
        
        // Update participant count
        function updateCount() {
            document.getElementById('participantCount').textContent = `${participants.length} people`;
        }
        
        // Initialize
        updateCount();
        drawWheel();
        window.addEventListener('resize', drawWheel);
        
        function drawWheel() {
            if (!canvas) return;
            
            // Set canvas size for high DPI displays
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
            
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            const radius = Math.min(rect.width, rect.height) / 2 - 20;
            
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (participants.length === 0) {
                // Draw empty wheel
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
                ctx.fillStyle = '#e0e0e0';
                ctx.fill();
                ctx.strokeStyle = '#999';
                ctx.lineWidth = 4;
                ctx.stroke();
                
                ctx.fillStyle = '#666';
                ctx.font = 'bold 24px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('Add participants to test', centerX, centerY);
                return;
            }
            
            // Draw wheel segments
            const count = participants.length;
            const sliceAngle = (2 * Math.PI) / count;
            const colors = ['#f94144', '#f3722c', '#f8961e', '#f9844a', '#f9c74f', '#90be6d', '#43aa8b', '#577590'];
            
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(currentRotation * Math.PI / 180); // Convert degrees to radians (same as live site)
            
            for (let i = 0; i < count; i++) {
                const startAngle = i * sliceAngle;
                const endAngle = startAngle + sliceAngle;
                
                // Draw slice
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, radius, startAngle, endAngle);
                ctx.closePath();
                ctx.fillStyle = colors[i % colors.length];
                ctx.fill();
                ctx.strokeStyle = '#111';
                ctx.lineWidth = 2;
                ctx.stroke();
                
                // Draw text with two-line format
                ctx.save();
                ctx.rotate(startAngle + sliceAngle / 2);
                ctx.translate(radius * 0.65, 0);
                ctx.rotate(Math.PI / 2);
                ctx.fillStyle = '#fff';
                
                // Calculate dynamic font size
                let fontSize = Math.max(9, Math.min(16, 350 / count));
                fontSize = Math.floor(fontSize);
                
                // Calculate maximum text width
                const sliceAngleRad = sliceAngle;
                const maxWidth = radius * sliceAngleRad * 0.75;
                
                // Calculate maximum vertical space for two lines
                const textRadius = radius * 0.6;
                const maxVerticalSpace = textRadius * 0.4;
                const lineSpacing = fontSize * 1.2;
                
                // Prepare first and last name
                let firstName = participants[i].firstName || '';
                let lastName = participants[i].lastName || '';
                
                // Helper function to shrink font and check if both lines fit
                function checkIfFits(first, last, fontSize) {
                    ctx.font = `bold ${fontSize}px Arial`;
                    const firstMetrics = ctx.measureText(first);
                    const lastMetrics = ctx.measureText(last);
                    
                    const fitsWidth = firstMetrics.width <= maxWidth && lastMetrics.width <= maxWidth;
                    const totalHeight = fontSize + lineSpacing + fontSize;
                    const fitsHeight = totalHeight <= maxVerticalSpace;
                    
                    return fitsWidth && fitsHeight;
                }
                
                // Shrink font until both lines fit
                const minFontSize = 7;
                while (!checkIfFits(firstName, lastName, fontSize) && fontSize > minFontSize) {
                    fontSize -= 0.5;
                }
                
                // If still doesn't fit, truncate names
                if (!checkIfFits(firstName, lastName, fontSize)) {
                    ctx.font = `bold ${fontSize}px Arial`;
                    
                    // Truncate first name if too wide
                    let firstMetrics = ctx.measureText(firstName);
                    if (firstMetrics.width > maxWidth) {
                        let truncated = firstName;
                        while (ctx.measureText(truncated + '...').width > maxWidth && truncated.length > 1) {
                            truncated = truncated.substring(0, truncated.length - 1);
                        }
                        firstName = truncated + '...';
                    }
                    
                    // Truncate last name if too wide
                    let lastMetrics = ctx.measureText(lastName);
                    if (lastMetrics.width > maxWidth) {
                        let truncated = lastName;
                        while (ctx.measureText(truncated + '...').width > maxWidth && truncated.length > 1) {
                            truncated = truncated.substring(0, truncated.length - 1);
                        }
                        lastName = truncated + '...';
                    }
                }
                
                // Set final font
                ctx.font = `bold ${fontSize}px Arial`;
                ctx.textAlign = 'center';
                
                // Add text shadow
                ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
                ctx.shadowBlur = 3;
                ctx.shadowOffsetX = 1;
                ctx.shadowOffsetY = 1;
                
                // Draw first name on top line
                ctx.textBaseline = 'bottom';
                ctx.fillText(firstName, 0, -lineSpacing / 2);
                
                // Draw last name on bottom line
                ctx.textBaseline = 'top';
                ctx.fillText(lastName, 0, lineSpacing / 2);
                ctx.restore();
            }
            
            ctx.restore();
        }
        
        // Test spin function
        function testSpin() {
            if (isSpinning || participants.length === 0) return;
            
            isSpinning = true;
            document.getElementById('spinBtn').disabled = true;
            
            // Instead of calculating which person to eliminate, we'll:
            // 1. Spin to a random rotation
            // 2. Detect which slice is actually under the pointer
            // 3. Eliminate that person
            // This guarantees the wheel lands on the person we eliminate!
            
            const sliceAngle = 360 / participants.length; // degrees per person
            
            // Generate a random final angle (where the wheel will stop)
            // This gives us a truly random result
            const randomFinalAngle = Math.random() * 360;
            
            // Add multiple full rotations for dramatic effect (5-8 full spins)
            const fullRotations = 5 + Math.floor(Math.random() * 4); // 5-8 spins
            const targetRotation = (fullRotations * 360) + randomFinalAngle;
            
            // Animate spin
            const startRotation = currentRotation;
            const startTime = Date.now();
            const duration = 3000; // 3 seconds
            
            function animate() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                // Easing function (ease-out)
                const easeOut = 1 - Math.pow(1 - progress, 3);
                
                currentRotation = startRotation + (targetRotation * easeOut);
                
                drawWheel();
                
                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    // Spin complete - detect which slice is actually under the pointer
                    const finalRotation = currentRotation % 360;
                    const sliceAngle = 360 / participants.length;
                    
                    // Calculate which slice is actually at the pointer (270°)
                    // When canvas is rotated by finalRotation, slices drawn at angle theta in rotated system
                    // appear at angle (theta + finalRotation) in original system
                    // Slice[i] center is drawn at: (i * sliceAngle + sliceAngle/2) in rotated system
                    // So it appears at: ((i * sliceAngle + sliceAngle/2) + finalRotation) % 360 in original system
                    // We want to find which i gives us 270° in original system
                    let actualIndex = -1;
                    let minDiff = Infinity;
                    for (let i = 0; i < participants.length; i++) {
                        const sliceCenterInRotated = (i * sliceAngle) + (sliceAngle / 2);
                        const sliceCenterInOriginal = (sliceCenterInRotated + finalRotation) % 360;
                        
                        // Calculate angular distance to 270° (pointer position)
                        let diff = Math.abs(sliceCenterInOriginal - 270);
                        if (diff > 180) diff = 360 - diff;
                        
                        if (diff < minDiff) {
                            minDiff = diff;
                            actualIndex = i;
                        }
                    }
                    
                    isSpinning = false;
                    document.getElementById('spinBtn').disabled = false;
                    
                    // Eliminate the person who is actually under the pointer
                    if (actualIndex >= 0) {
                        const eliminatedParticipant = participants[actualIndex];
                        const eliminatedName = `${eliminatedParticipant.firstName} ${eliminatedParticipant.lastName}`;
                        alert(`✅ Eliminated: ${eliminatedName}`);
                    } else {
                        alert('❌ Could not determine which slice is under the pointer');
                    }
                }
            }
            
            animate();
        }
        
        // Reset wheel
        function resetWheel() {
            currentRotation = 0;
            isSpinning = false;
            document.getElementById('spinBtn').disabled = false;
            drawWheel();
        }
    </script>
</body>
</html>
